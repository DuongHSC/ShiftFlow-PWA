# ShiftFlow PWA — Build & deploy to GitHub Pages.
#
# The PWA is served from a GitHub "project page" at:
#   https://<user>.github.io/<repo>/
# so Vite must build with base = "/<repo>/". This workflow derives that
# automatically from the repository name, so you don't have to edit anything.
#
# One-time setup after pushing:
#   Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.

name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Force UTF-8 so the runner's trace listener can handle emoji in tool output
    # (fixes: System.Text.EncoderFallbackException: Unable to translate \uD83D).
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base path = "/<repo-name>/" (project pages). If you use a custom domain
      # or a <user>.github.io repo, set repo variable SHIFTFLOW_BASE to "/".
      - name: Compute base path
        id: base
        run: |
          if [ -n "${{ vars.SHIFTFLOW_BASE }}" ]; then
            echo "base=${{ vars.SHIFTFLOW_BASE }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      # Build only in the deploy job. Tests run in a separate workflow (ci.yml)
      # so emoji-heavy test output never reaches this runner's trace, which was
      # crashing with an EncoderFallbackException (\uD83D) on the runner.
      - name: Build
        run: npm run build
        env:
          SHIFTFLOW_BASE: ${{ steps.base.outputs.base }}
          FORCE_COLOR: "0"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
